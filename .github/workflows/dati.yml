name: Aggiorna dati
on:
  schedule: [{cron: '0 4,14 * * *'}]
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/build-data.mjs
        env: {TMDB_KEY: '${{ secrets.TMDB_KEY }}', FD_KEY: '${{ secrets.FD_KEY }}'}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add data && (git diff --cached --quiet || (git commit -m "dati" && git push))
